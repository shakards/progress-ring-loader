<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Progress Ring Loader</title>
    <style>
        .loader {
            width: 50px;
            aspect-ratio: 1;
            border-radius: 50%;
            padding: 3px;
            background: 
                radial-gradient(farthest-side, #ffa516 95%, transparent) 50% 0/12px 12px no-repeat,
                radial-gradient(farthest-side, transparent calc(100% - 5px), #ffa516 calc(100% - 4px)) content-box;
            animation: spin 2s infinite linear;
        }

        @keyframes spin {
            to { transform: rotate(1turn); }
        }

        /* Optional centering and styling */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #f5f5f5;
        }
    </style>
</head>
<body>
    <div class="loader"></div>
</body>
</html>
